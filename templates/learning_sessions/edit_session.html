
{% extends "base.html" %}

{% block title %}Edit Learning Session | SkillCircle{% endblock %}

{% block content %}
<div class="page-shell">
    <div class="section-heading">
        <div>
            <p class="eyebrow">LEARNING SESSIONS</p>
            <h1>Edit Learning Session</h1>
            <p class="form-intro">
                Update the date, time, meeting link, or notes.
            </p>
        </div>
    </div>

    <div class="form-card">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="session_date">Session Date</label>
                <input
                    type="date"
                    id="session_date"
                    name="session_date"
                    value="{{ session.session_date|date:'Y-m-d' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="start_time">Start Time</label>
                <input
                    type="time"
                    id="start_time"
                    name="start_time"
                    value="{{ session.start_time|time:'H:i' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="end_time">End Time</label>
                <input
                    type="time"
                    id="end_time"
                    name="end_time"
                    value="{{ session.end_time|time:'H:i' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="meeting_link">Meeting Link</label>
                <input
                    type="url"
                    id="meeting_link"
                    name="meeting_link"
                    value="{{ session.meeting_link }}"
                    placeholder="https://meet.google.com/..."
                >
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea
                    id="notes"
                    name="notes"
                    rows="4"
                    placeholder="Add session notes..."
                >{{ session.notes }}</textarea>
            </div>

            <div class="detail-actions">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a
                    href="{% url 'learning_sessions:session_list' %}"
                    class="btn"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
